[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfence"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]
research = ["openai>=2.54,<3"]

[tool.setuptools.packages.find]
include = ["agentfence", "agentfence.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires an explicitly provisioned disposable fga-dotnet service"]
